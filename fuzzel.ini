text = ffdd33ff
prompt = ffdd33ff
input = ffdd33ff
selection = ffdd33ff
selection-text = 282828ff
match = ffdd33ff
selection-match = 282828ff
border = ffdd33ff

[border]
width = 2
radius = 0
