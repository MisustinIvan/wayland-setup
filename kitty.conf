# fonts
font_family 		family='Iosevka Nerd Font Mono' postscript_name=IosevkaNFM
bold_font			auto
italic_font			auto
bold_italic_font	auto
font_size 			15.0
text_composition_strategy	legacy
disable_ligatures	never

# shell/misc
shell				fish
editor				nvim
scrollback_lines	5000
confirm_os_window_close 0

allow_remote_control 	yes
listen_on				unix:@kitty

enabled_layouts		splits,stack

# window
window_padding_width	0
placement_strategy		top-left
background_opacity		1.0

# cursor
cursor_shape		block
cursor_blink_interval 0
shell_integration	no-cursor

# colors
foreground				#e4e4e4
background				#181818
cursor					#ffdd33
cursor_text_color		#181818
selection_foreground	none
selection_background	#484848

# black
color0	#282828
color8 	#282828
# red
color1 	#f43841
color9 	#f43841
# green
color2 	#73d936
color10 #73d936
# yellow
color3 	#ffdd33
color11 #ffdd33
